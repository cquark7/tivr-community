<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="256" height="256" role="img" aria-label="tivr" class="tivr-brand" data-theme="auto" data-animated="true"><title>tivr</title>
<style>/* Scoped to tivr; no page-wide SVG or animation rules. */
.tivr-brand{--tivr-b0:#0AA5E0;--tivr-b1:#1763E8;--tivr-b2:#1E40AF;--tivr-b3:#3730A3;--tivr-e0:#CFF1FF;--tivr-e1:#7CC8F5;--tivr-e2:#1E40AF;--tivr-g:.18;--tivr-c0:#0EA5E9;--tivr-c1:#0891B2;--tivr-c2:#38BDF8;--tivr-ring:#0284C7;--tivr-vtx:#1D4ED8;--tivr-sp:#1D4ED8;--tivr-hal:.18;display:inline-block;vertical-align:middle;background:transparent}
@media (prefers-color-scheme:dark){.tivr-brand:not([data-theme="light"]):not([data-theme="dark"]){--tivr-b0:#5EE7FF;--tivr-b1:#1E90FF;--tivr-b2:#1D4ED8;--tivr-b3:#4338CA;--tivr-e0:#FFFFFF;--tivr-e1:#A5F3FC;--tivr-e2:#38BDF8;--tivr-g:.30;--tivr-c0:#67E8F9;--tivr-c1:#06B6D4;--tivr-c2:#A5F3FC;--tivr-ring:#7DE9FF;--tivr-vtx:#E0FBFF;--tivr-sp:#FFFFFF;--tivr-hal:.35;}}
:is(.light,[data-theme="light"]) .tivr-brand:not([data-theme="light"]):not([data-theme="dark"]){--tivr-b0:#0AA5E0;--tivr-b1:#1763E8;--tivr-b2:#1E40AF;--tivr-b3:#3730A3;--tivr-e0:#CFF1FF;--tivr-e1:#7CC8F5;--tivr-e2:#1E40AF;--tivr-g:.18;--tivr-c0:#0EA5E9;--tivr-c1:#0891B2;--tivr-c2:#38BDF8;--tivr-ring:#0284C7;--tivr-vtx:#1D4ED8;--tivr-sp:#1D4ED8;--tivr-hal:.18;}
:is(.dark,[data-theme="dark"]) .tivr-brand:not([data-theme="light"]):not([data-theme="dark"]){--tivr-b0:#5EE7FF;--tivr-b1:#1E90FF;--tivr-b2:#1D4ED8;--tivr-b3:#4338CA;--tivr-e0:#FFFFFF;--tivr-e1:#A5F3FC;--tivr-e2:#38BDF8;--tivr-g:.30;--tivr-c0:#67E8F9;--tivr-c1:#06B6D4;--tivr-c2:#A5F3FC;--tivr-ring:#7DE9FF;--tivr-vtx:#E0FBFF;--tivr-sp:#FFFFFF;--tivr-hal:.35;}
.tivr-brand[data-theme="light"]{--tivr-b0:#0AA5E0;--tivr-b1:#1763E8;--tivr-b2:#1E40AF;--tivr-b3:#3730A3;--tivr-e0:#CFF1FF;--tivr-e1:#7CC8F5;--tivr-e2:#1E40AF;--tivr-g:.18;--tivr-c0:#0EA5E9;--tivr-c1:#0891B2;--tivr-c2:#38BDF8;--tivr-ring:#0284C7;--tivr-vtx:#1D4ED8;--tivr-sp:#1D4ED8;--tivr-hal:.18;}
.tivr-brand[data-theme="dark"]{--tivr-b0:#5EE7FF;--tivr-b1:#1E90FF;--tivr-b2:#1D4ED8;--tivr-b3:#4338CA;--tivr-e0:#FFFFFF;--tivr-e1:#A5F3FC;--tivr-e2:#38BDF8;--tivr-g:.30;--tivr-c0:#67E8F9;--tivr-c1:#06B6D4;--tivr-c2:#A5F3FC;--tivr-ring:#7DE9FF;--tivr-vtx:#E0FBFF;--tivr-sp:#FFFFFF;--tivr-hal:.35;}
.tivr-brand .tivr-speed{opacity:.86;animation:tivr-speed-drift 5.6s ease-in-out var(--tivr-delay,0s) infinite}
.tivr-brand .tivr-pixel{opacity:.9;animation:tivr-pixel-breathe 5.2s ease-in-out var(--tivr-delay,0s) infinite}
.tivr-brand .tivr-origin{transform-origin:862px 155px;transform-box:view-box}
.tivr-brand .tivr-hex{animation:tivr-orbit-turn 72s linear infinite}
.tivr-brand .tivr-orbit{animation:tivr-orbit-turn 24s linear infinite}
.tivr-brand .tivr-halo{opacity:var(--tivr-hal)}
@keyframes tivr-speed-drift{0%,100%{opacity:.8;transform:translateX(0)}50%{opacity:1;transform:translateX(3px)}}
@keyframes tivr-pixel-breathe{0%,100%{opacity:.84}50%{opacity:1}}
@keyframes tivr-orbit-turn{to{transform:rotate(360deg)}}
.tivr-brand[data-animated="false"] *{animation:none!important}
@media (prefers-reduced-motion:reduce){.tivr-brand *{animation:none!important}}
</style>
