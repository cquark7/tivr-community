<g transform="translate(644 241) skewX(-15)"><rect class="tivr-pixel" style="--tivr-delay:0s" x="-23" y="-23" width="46" height="46" rx="5" fill="url(#tivr-icon-pg)" /></g>
<g transform="translate(694 310) skewX(-15)"><rect class="tivr-pixel" style="--tivr-delay:.4s;fill:var(--tivr-c2)" x="-23" y="-23" width="46" height="46" rx="5" /></g>
<g transform="translate(607 379) skewX(-15)"><rect class="tivr-pixel" style="--tivr-delay:.8s" x="-23" y="-23" width="46" height="46" rx="5" fill="url(#tivr-icon-pg)" /></g>
</g></g>
